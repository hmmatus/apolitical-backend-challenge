services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-pizza_dev}
      - MYSQL_USER=${MYSQL_USER:-pizza}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-pizza}
    depends_on:
      db:
        condition: service_healthy
    command: pnpm dev

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pizza_dev}
      MYSQL_USER: ${MYSQL_USER:-pizza}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pizza}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysqldata:
